name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Installer version (example: 0.5.0-beta.1)'
        required: true
        default: '0.5.0-beta.1'
        type: string

permissions:
  contents: read

jobs:
  windows:
    name: Test and package Windows x64
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python 3.12 x86 for NI-CAN
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x86
      - name: Build the 32-bit NI-CAN helper
        run: |
          python -m pip install -c packaging/windows/constraints.txt pyinstaller pyinstaller-hooks-contrib python-can
          if ($LASTEXITCODE -ne 0) { throw 'NI-CAN helper dependency setup failed.' }
          python -m PyInstaller --onedir --name SignalExplorer-NICAN --distpath build/nican --workpath build/nican-work --specpath build/nican-work src/signal_explorer/bus/nican_worker.py
          if ($LASTEXITCODE -ne 0) { throw 'NI-CAN helper build failed.' }
      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            packaging/windows/constraints.txt
            packaging/windows/requirements-build.txt
            pyproject.toml
      - name: Install tested application and packaging dependencies
        run: |
          python -m pip install -c packaging/windows/constraints.txt -r packaging/windows/requirements-build.txt ".[intrepid,nixnet]" "gs-usb==0.3.1" "pyusb==1.3.1"
          if ($LASTEXITCODE -ne 0) { throw 'Dependency install failed.' }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Dependency verification failed.' }
      - name: Run software tests
        timeout-minutes: 10
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          # Keep the active test and thread stacks visible even if a test hangs.
          python -u -m pytest tests -vv -s --durations=15 -o faulthandler_timeout=60 --junitxml=build/test-results.xml 2>&1 | Tee-Object -FilePath build/software-tests.log
          if ($LASTEXITCODE -ne 0) { throw 'Software tests failed.' }
      - name: Build and verify the installer
        env:
          BUILD_VERSION: ${{ inputs.version }}
        run: ./packaging/windows/build.ps1 -Version $env:BUILD_VERSION -NiCanHelper build/nican/SignalExplorer-NICAN
      - name: Upload installer and checksums
        uses: actions/upload-artifact@v4
        with:
          name: SignalExplorer-windows-x64-${{ inputs.version }}
          path: dist/installer/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-build-diagnostics-${{ github.run_id }}
          path: |
            build/software-tests.log
            build/test-results.xml
            build/packaging-smoke.json
            build/pyinstaller/**/warn-*.txt
          if-no-files-found: ignore
          retention-days: 30
